<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Pragma component inventory example</title>
  <desc id="desc">A concise visual inventory of mapped Pragma components, typography and migration gaps.</desc>
  <rect width="1440" height="520" fill="#ffffff"/>
  <rect x="1" y="1" width="1438" height="518" rx="8" fill="#ffffff" stroke="#cdcdcd"/>
  <text x="48" y="70" fill="#1f1f1f" font-family="Ubuntu Sans, sans-serif" font-size="36" font-weight="600">Pragma migration inventory</text>
  <text x="48" y="108" fill="#545454" font-family="Ubuntu Sans, sans-serif" font-size="20">Linked components, typography and implementation notes.</text>
  <g transform="translate(48 150)">
    <rect width="1344" height="104" rx="6" fill="#ffffff" stroke="#cdcdcd"/>
    <text x="24" y="36" fill="#1f1f1f" font-family="Ubuntu Sans, sans-serif" font-size="22" font-weight="600">Fields and actions</text>
    <rect x="24" y="54" width="300" height="32" rx="4" fill="#f3f3f3"/>
    <text x="38" y="76" fill="#545454" font-family="Ubuntu Sans, sans-serif" font-size="16">Search</text>
    <rect x="342" y="54" width="180" height="32" rx="4" fill="#f3f3f3"/>
    <text x="356" y="76" fill="#545454" font-family="Ubuntu Sans, sans-serif" font-size="16">Select field</text>
    <rect x="540" y="54" width="126" height="32" rx="4" fill="#e8e8e8"/>
    <text x="555" y="76" fill="#1f1f1f" font-family="Ubuntu Sans, sans-serif" font-size="16">Button</text>
  </g>
  <g transform="translate(48 274)">
    <rect width="1344" height="104" rx="6" fill="#ffffff" stroke="#cdcdcd"/>
    <text x="24" y="36" fill="#1f1f1f" font-family="Ubuntu Sans, sans-serif" font-size="22" font-weight="600">Data table and status</text>
    <rect x="24" y="54" width="188" height="32" fill="#f3f3f3"/>
    <rect x="212" y="54" width="422" height="32" fill="#ffffff" stroke="#d9d9d9"/>
    <rect x="634" y="54" width="144" height="32" fill="#ffffff" stroke="#d9d9d9"/>
    <rect x="798" y="58" width="84" height="24" rx="12" fill="#e8e8e8"/>
  </g>
  <rect x="48" y="400" width="1344" height="72" rx="6" fill="#fff4e5" stroke="#e9a83a"/>
  <text x="72" y="432" fill="#6e4700" font-family="Ubuntu Sans, sans-serif" font-size="20" font-weight="600">Known gap</text>
  <text x="72" y="458" fill="#6e4700" font-family="Ubuntu Sans, sans-serif" font-size="16">Use a foundation-composed surface when a Pragma component is not available.</text>
</svg>